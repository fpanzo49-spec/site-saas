name = "restaurante"   # tem de ser IGUAL ao nome do Worker na Cloudflare
main = "src/index.js"
compatibility_date = "2025-09-01"

# Fotos (R2): crie ANTES do primeiro deploy um bucket com este nome (Cloudflare > R2 > Create bucket)
[[r2_buckets]]
binding = "FOTOS"
bucket_name = "restaurante-fotos"

# Um só Worker serve TODOS os restaurantes: cada endereço (subdomínio) é um cliente.
# Variables and Secrets (Cloudflare > Worker > Settings):
#   DATABASE_URL        (obrigatório) a MESMA string do Neon usada no Super Admin
#   RESEND_API_KEY, RESEND_FROM   (opcional) emails de reservas/encomendas e campanhas de marketing
#   OPENROUTER_API_KEY            (plano 2) chave do OpenRouter para o chat
#   OPENROUTER_MODEL, MAX_CHAT_DIA (opcionais) modelo (padrão openai/gpt-4o-mini) e limite diário por restaurante (padrão 300)
